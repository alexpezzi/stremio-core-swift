[workspace]
resolver = "2"
members = [".", "stremio-core-protobuf"]

[workspace.dependencies]
stremio-core = { git = "https://github.com/Stremio/stremio-core", rev = "2c89236b47dfcd5e844c1dfae5737164cb616fbf", features = [
    "derive",
    "analytics",
    "env-future-send",
] }
stremio-core-protobuf = { path = "stremio-core-protobuf", default-features = false }

prost = "0.13"
prost-types = "0.13"
prost-build = { version = "0.13", features = ["cleanup-markdown"] }
protox = "0.7"
glob = "0.3.0"
itertools = "0.14"

[package]
name = "stremio-core-swift"
version = "1.3.0"
authors = ["Smart Code OOD"]
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "src/commonMain/rust/lib.rs"

[profile.release]
lto = true
opt-level = 3

[dependencies]
stremio-core.workspace = true
stremio-core-protobuf.workspace = true
prost.workspace = true

serde = "1.0.*"
serde_json = "1.0.*"
serde_path_to_error = "0.1.*"
futures = "0.3.*"
http = "1"
url = { version = "2.4", features = ["serde"] }
chrono = "0.4.*"
hex = "0.4.*"

once_cell = "1"
enclose = "1.1.*"
getrandom = "0.2.*"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

objc2-foundation = { version = "0.2.2", features = [
    "NSString",
    "NSData",
    "NSUserDefaults",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSURL",
    "NSError",
    "block2",
] }
objc2 = "0.5.2"
block2 = "0.5.1"

# A way to quickly test with local version of `core` crates
# [patch.'https://github.com/Stremio/stremio-core']
# stremio-core = { path = "../stremio-core" }
